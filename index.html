<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jogos Arandu Lab</title>
<style>
  :root{--ink:#2b2340;--paper:#fbf5e6;--rose:#ef8fa3;--teal:#3fb3a8;--sun:#f6c445}
  body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font:18px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center}
  main{width:min(560px,100%);padding:32px max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
  h1{font-size:28px;margin:0 0 6px}
  p{margin:0 0 24px;opacity:.8}
  a.jogo{display:flex;gap:16px;align-items:center;text-decoration:none;color:inherit;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:16px 20px;box-shadow:0 6px 0 var(--ink)}
  a.jogo:active{box-shadow:0 2px 0 var(--ink);transform:translateY(4px)}
  a.jogo:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
  .letras{display:flex;gap:6px;flex:none}
  .letras span{width:44px;height:52px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:32px;border:3px solid var(--ink)}
  .e{background:#ffd3dc}.a{background:#c9efe9}
  b{display:block;font-size:20px}
  small{opacity:.75}
</style>
</head>
<body>
<main>
  <h1>Jogos Arandu Lab</h1>
  <p>Áurea e Arandu · alfabetização em colagem</p>
  <a class="jogo" href="jogos/alf/parque-dos-bichos/">
    <span class="letras"><span class="e">E</span><span class="a">A</span></span>
    <span><b>Parque dos Bichos</b><small>ALF-011 · as letras E e A · 1º ano</small></span>
  </a>
</main>
</body>
</html>
